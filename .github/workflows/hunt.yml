name: hunt

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: oci-hunt
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      GH_TOKEN: ${{ github.token }}
      AD: "wdGy:AP-HYDERABAD-1-AD-1"
      SUBNET: "ocid1.subnet.oc1.ap-hyderabad-1.aaaaaaaacek3cl36vknbljpxdm7xeyuexaxaj5x453g7wqcnxfr73nvjbmrq"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Hunt for capacity
        run: |
          set -uo pipefail
          T="$OCI_CLI_TENANCY"

          # Already have a live ARM instance? Do nothing (keeps runs cheap + green once it lands).
          active=$(oci compute instance list -c "$T" --all --output json 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin).get('data',[]); print(sum(1 for i in d if 'A1.Flex' in (i.get('shape') or '') and (i.get('lifecycle-state') in ('RUNNING','PROVISIONING','STARTING'))))" 2>/dev/null || echo 0)
          if [ "${active:-0}" != "0" ]; then
            echo "ARM instance already exists ($active). Nothing to do."
            exit 0
          fi

          IMG=$(oci compute image list -c "$T" --operating-system "Canonical Ubuntu" \
            --operating-system-version "24.04" --shape VM.Standard.A1.Flex \
            --query "data[0].id" --raw-output)
          echo "Ubuntu image: $IMG"

          echo 'ssh-rsa  ssh-key-2026-09-07' > /tmp/ssh.pub

          GOT=""
          for SZ in "2 12" "1 12" "1 6"; do
            set -- $SZ; OCPU=$1; MEM=$2
            for FD in FAULT-DOMAIN-1 FAULT-DOMAIN-2 FAULT-DOMAIN-3; do
              if oci compute instance launch -c "$T" \
                   --availability-domain "$AD" --fault-domain "$FD" \
                   --shape VM.Standard.A1.Flex \
                   --shape-config "{\"ocpus\":$OCPU,\"memoryInGBs\":$MEM}" \
                   --image-id "$IMG" --subnet-id "$SUBNET" --assign-public-ip true \
                   --ssh-authorized-keys-file /tmp/ssh.pub \
                   --display-name "free-${OCPU}c-${MEM}g" > /tmp/out.json 2> /tmp/err.txt; then
                echo "::notice title=VM ACQUIRED::${OCPU} OCPU / ${MEM} GB"
                GOT="${OCPU} OCPU / ${MEM} GB"
                break 2
              fi
              if   grep -qi "Out of host capacity" /tmp/err.txt; then
                echo "no capacity   ${OCPU}c/${MEM}g   $FD"
              elif grep -qiE "LimitExceeded|quota|maximum number" /tmp/err.txt; then
                echo "::warning::limit hit for ${OCPU}c/${MEM}g -> $(tr -d '\n' < /tmp/err.txt | cut -c1-200)"
              else
                echo "other error   ${OCPU}c/${MEM}g   $FD -> $(tr -d '\n' < /tmp/err.txt | cut -c1-200)"
              fi
            done
          done

          if [ -n "$GOT" ]; then
            gh issue create \
              --title "Oracle VM acquired: $GOT" \
              --body "The retry workflow launched an instance ($GOT). Open the OCI console -> Compute -> Instances. Future runs will now no-op automatically." \
              || true
          fi
