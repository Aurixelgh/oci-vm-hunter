name: hunt

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: oci-hunt
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      GH_TOKEN: ${{ github.token }}
      AD: "wdGy:AP-HYDERABAD-1-AD-1"
      SUBNET: "ocid1.subnet.oc1.ap-hyderabad-1.aaaaaaaacek3cl36vknbljpxdm7xeyuexaxaj5x453g7wqcnxfr73nvjbmrq"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Hunt for capacity
        run: |
          set -uo pipefail
          T="$OCI_CLI_TENANCY"

          # Already have a live ARM instance? Do nothing (keeps runs cheap + green once it lands).
          active=$(oci compute instance list -c "$T" --all --output json 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin).get('data',[]); print(sum(1 for i in d if 'A1.Flex' in (i.get('shape') or '') and (i.get('lifecycle-state') in ('RUNNING','PROVISIONING','STARTING'))))" 2>/dev/null || echo 0)
          if [ "${active:-0}" != "0" ]; then
            echo "ARM instance already exists ($active). Nothing to do."
            exit 0
          fi

          # ONE launch attempt per run, rotating the size. The cron fires every ~5 min,
          # so this is ~1 call / 5 min -- well under Oracle's per-tenancy launch limit.
          case $(( ${{ github.run_number }} % 3 )) in
            0) OCPU=2; MEM=12 ;;
            1) OCPU=1; MEM=12 ;;
            *) OCPU=1; MEM=6  ;;
          esac
          echo "trying ${OCPU} OCPU / ${MEM} GB"

          IMG=$(oci compute image list -c "$T" --operating-system "Canonical Ubuntu" \
            --operating-system-version "24.04" --shape VM.Standard.A1.Flex \
            --query "data[0].id" --raw-output)

          echo 'ssh-rsa  ssh-key-2026-09-07' > /tmp/ssh.pub

          if oci compute instance launch -c "$T" --no-retry \
               --availability-domain "$AD" \
               --shape VM.Standard.A1.Flex \
               --shape-config "{\"ocpus\":$OCPU,\"memoryInGBs\":$MEM}" \
               --image-id "$IMG" --subnet-id "$SUBNET" --assign-public-ip true \
               --ssh-authorized-keys-file /tmp/ssh.pub \
               --display-name "free-${OCPU}c-${MEM}g" > /tmp/out.json 2> /tmp/err.txt; then
            echo "::notice title=VM ACQUIRED::${OCPU} OCPU / ${MEM} GB"
            gh issue create \
              --title "Oracle VM acquired: ${OCPU} OCPU / ${MEM} GB" \
              --body "The retry workflow launched an instance. Open the OCI console -> Compute -> Instances. Future runs will no-op automatically." \
              || true
            exit 0
          fi

          E=$(tr -d '\n' < /tmp/err.txt | cut -c1-250)
          if   grep -qi "Out of host capacity" /tmp/err.txt; then echo "no capacity (${OCPU}c/${MEM}g)"
          elif grep -qi "TooManyRequests"      /tmp/err.txt; then echo "rate limited -- backing off, next run in ~5 min"
          elif grep -qiE "LimitExceeded|maximum number" /tmp/err.txt; then echo "::warning::LIMIT: $E"
          else echo "::warning::unexpected: $E"
          fi
